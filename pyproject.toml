[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI dependency defaults are declared in the signature
    "E501",  # long lines are handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
